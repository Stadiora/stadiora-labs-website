<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>coach-powerlab</title>
<link rel="stylesheet" href="stage.css" />
<style>
.ph{background-image:url(../src/f4-powerlab.webp);background-size:auto 112%;--bp:82% 0%;--kx:-1.4%;--ky:-1%}
.vg{position:absolute;inset:0;background:radial-gradient(110% 90% at 60% 50%,transparent 40%,rgba(2,6,18,.66) 100%),linear-gradient(180deg,rgba(4,10,26,.45),rgba(4,10,26,.12) 40%,rgba(4,10,26,.5))}
.ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 1px,transparent 1px 64px);mask:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);animation:tk 8s linear infinite}
@keyframes tk{to{background-position:128px 0}}
</style>
</head>
<body>
<div class="st" id="st">
<div class="ph kb"></div>
<div class="layer">
  <div class="blob" style="left:-8%;bottom:-20%;width:48%;height:56%;background:rgba(0,190,243,.30);--bx:60px;--by:-30px"></div>
  <div class="blob" style="right:-6%;top:-16%;width:40%;height:50%;background:rgba(255,184,77,.22);--bx:-50px;--by:36px"></div>
  <div class="ticks"></div>
  <div class="scan"></div>
  <div id="particles"></div>
  <div class="vg"></div>
</div>
</div>
<script>
// Deterministic particles so every render is identical.
let s = 41;
const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
const host = document.getElementById('particles');
for (let i = 0; i < 14; i++) {
  const d = document.createElement('i');
  d.className = 'dust';
  const per = [4, 8, 8, 4][i % 4];
  d.style.cssText = `left:${(rnd() * 96 + 2).toFixed(1)}%;top:${(rnd() * 70 + 22).toFixed(1)}%;--s:${(2 + rnd() * 4).toFixed(1)}px;--dd:${per}s;--dl:-${(rnd() * per).toFixed(2)}s;--dx:${(rnd() * 60 - 30).toFixed(0)}px;--dy:${(-60 - rnd() * 120).toFixed(0)}px`;
  host.appendChild(d);
}
</script>
</body>
</html>
